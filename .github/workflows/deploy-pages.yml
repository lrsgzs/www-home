# Deploys the built static site (dist/) to GitHub Pages.
# Push to `main` (or run manually) -> build -> publish.
name: Deploy to GitHub Pages

on:
    push:
        branches: ['main']

    # Allows running this workflow manually from the Actions tab
    workflow_dispatch:

# Grant GITHUB_TOKEN permission to deploy to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment; cancel in-progress runs
concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # Custom domain file lives at the repo root; the site root is dist/.
            - name: Add CNAME for custom domain
              run: cp CNAME dist/CNAME

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
